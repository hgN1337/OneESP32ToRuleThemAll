#########################################
#                                       #
#   ESPHome                             #
#                                       #
#########################################
esphome:
  platformio_options:
    build_flags:
      - "-DTHZ_5_5_ECO"

#########################################
#                                       #
#   Global variables                    #
#                                       #
#########################################
globals:
  - id: heat_pump_variant
    type: std::string
    initial_value: '"THZ55ECO"'

#########################################
#                                       #
#   Packages                            #
#                                       #
#########################################
packages:
  THZ_BASE:      !include { file: thz_base.yaml }

  ZEITSPERRE_NE: !include { file: templates/wp_number.yaml , vars: { property: "ZEITSPERRE_NE" , icon: "mdi:valve" , min: "0", max: "360", step: "5.0" }}
  LUEFT_ZEIT_AUSSERPLAN_STUFE0: !include { file: templates/wp_number.yaml, vars: { property: "LUEFT_ZEIT_AUSSERPLAN_STUFE0",   icon: "mdi:fan-clock", min: "0", max: "1000",  step: "5"   }}
  LUEFT_ZEIT_AUSSERPLAN_STUFE1: !include { file: templates/wp_number.yaml, vars: { property: "LUEFT_ZEIT_AUSSERPLAN_STUFE1",   icon: "mdi:fan-clock", min: "0", max: "1000",  step: "5"   }}
  LUEFT_ZEIT_AUSSERPLAN_STUFE2: !include { file: templates/wp_number.yaml, vars: { property: "LUEFT_ZEIT_AUSSERPLAN_STUFE2",   icon: "mdi:fan-clock", min: "0", max: "1000",  step: "5"   }}
  LUEFT_ZEIT_AUSSERPLAN_STUFE3: !include { file: templates/wp_number.yaml, vars: { property: "LUEFT_ZEIT_AUSSERPLAN_STUFE3",   icon: "mdi:fan-clock", min: "0", max: "1000",  step: "5"   }}
  LUEFT_STUFE_AUSSERPLAN: !include { file: templates/wp_number.yaml, vars: { property: "LUEFT_STUFE_AUSSERPLAN", icon: "mdi:fan-chevron-up", min: "0", max: "3", step: "1" }}
  LUFTSTOP_SOMMER_WWB: !include { file: templates/wp_switch.yaml, vars: { property: "LUFTSTOP_SOMMER_WWB", icon: "mdi:heat-wave" }}
  FEUCHTESCHUTZ:                !include { file: templates/wp_switch.yaml, vars: { property: "FEUCHTESCHUTZ", icon: "mdi:water-percent-alert" }}
  FEUCHTE_SCHWELLWERT:          !include { file: templates/wp_number.yaml, vars: { property: "FEUCHTE_SCHWELLWERT",          icon: "mdi:water-percent", unit: "%", min: "0", max: "100", step: "1" }}
  FEUCHTE_HYSTERESE:            !include { file: templates/wp_number.yaml, vars: { property: "FEUCHTE_HYSTERESE",            icon: "mdi:water-percent", unit: "%", min: "0", max: "20",  step: "1" }}
  FEUCHTE_MASKIERZEIT:          !include { file: templates/wp_number.yaml, vars: { property: "FEUCHTE_MASKIERZEIT",          icon: "mdi:timer-outline",            min: "0", max: "60",  step: "1" }}
  FEUCHTE_MIN:                  !include { file: templates/wp_number.yaml, vars: { property: "FEUCHTE_MIN",                  icon: "mdi:water-percent", unit: "%", min: "0", max: "100", step: "1" }}
  FEUCHTE_LUEFTUNGSREDUZIERUNG: !include { file: templates/wp_number.yaml, vars: { property: "FEUCHTE_LUEFTUNGSREDUZIERUNG", icon: "mdi:fan-minus",     unit: "%", min: "0", max: "100", step: "1" }}
  FEUCHTE_SOLL:                 !include { file: templates/wp_number.yaml, vars: { property: "FEUCHTE_SOLL",                 icon: "mdi:water-percent", unit: "%", min: "0", max: "100", step: "1" }}
  FEUCHTE_LEISTUNGSERHOEHUNG:   !include { file: templates/wp_number.yaml, vars: { property: "FEUCHTE_LEISTUNGSERHOEHUNG",   icon: "mdi:fan-plus",      unit: "%", min: "0", max: "100", step: "1" }}
